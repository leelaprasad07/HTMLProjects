<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h3>Register Form(Using Table)</h3>
        <table  cellpadding="10" text-align="center"  style="border-collapse: collapse;" border="1" width =400px  >    
        <tr>
            <td>
               <label>Full Name:</label>
            </td>
            <td>
            <input type="Full Name">
            </td>
        </tr> 
        <tr>
            <td>
                <label>Email:</label>
            </td>
            <td>
            <input type="Email">
            </td>  
        </tr>  
        <tr>
            <td>
                <label>Password:</label>
            </td>
            <td>
            <input type="password"> 
            </td>
            
        </tr>
        <tr>
            <td>
                <label>Age:</label>
            </td>
            <td>
            <input type="number" min="1" max="100"> 
            </td>
            
        </tr>
        <tr>
            <td>
                <label>Gender:</label>
            </td>
            <td>
            <input type="radio"> Male<input type="Radio"> Female
            </td>
            
        </tr>
        <tr>
            <td>
                <label>Address:</label>
            </td>
            <td><textarea></textarea></td>
            
        </tr>   
        <tr>
            <th colspan="2">
                <button>Register</button> <button>Clear</button>
            </th>
        </tr>      
        
        </table>
    </form>
    
    
</body>
</html>
